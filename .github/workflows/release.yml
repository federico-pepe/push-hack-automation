name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' hack.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match hack.json version ($MODULE_VERSION)"
            echo "Update hack.json to version $TAG_VERSION before tagging."
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: |
          mkdir -p dist/automation
          cd src
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o ../dist/automation/automation .
          cd ..
          cp hack.json dist/automation/hack.json
          chmod +x dist/automation/automation

      - name: Package
        run: tar -czf automation.tar.gz -C dist automation

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: automation.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cat > release.json << EOF
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/automation.tar.gz",
            "released_at": "${RELEASED_AT}"
          }
          EOF
          git add release.json
          git commit -m "chore: update release.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
